---
header:
  version: 8
  includes:
    - kas/common.yml

repos:
  meta-virtualization:
    url: https://git.yoctoproject.org/git/meta-virtualization
    refspec: 54b806b1985f3989722ee308e1073530fe3328c1

distro: tb-xen-distro
machine: genericx86-64
target:
  - tb-full-initramfs

local_conf_header:
  no-sstate-mirror: |
    SSTATE_MIRRORS = ""
  externalsrc: |
    INHERIT += "externalsrc"
    EXTERNALSRC:pn-xen = "/work/xen"
    EXTERNALSRC_BUILD:pn-xen = "/work/xen"
    EXTERNALSRC:pn-skl = "/work/skl"
    EXTERNALSRC_BUILD:pn-skl = "/work/skl"
    EXTERNALSRC:pn-grub-efi = "/work/grub"
